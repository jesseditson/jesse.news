content = """
New project: [bowling.jesseditson.com](https://bowling.jesseditson.com), a little shop for 3D printable bowling stuff.

A surprising number of bowlers (at least on my league) have 3D printers, but none of them have CAD experience, or seemingly much interest in it. Seemed like a cool use of the new [archival payments feature](https://archival.dev/update/sell-from-your-site) to give people a small tool to generate custom STLs, and to download or buy the print.

If you're in need of a slick customized ball cup, hit the link and buy one! Also if you don't wanna pay the $2 just let me know in the comments (or email) and I'll send you a discount code to make it free."""
