Flew to Barcelona today, getting ready for Mozfest. This city really is one of my favorite places on earth, despite how little I understand of the language.

<br />

I landed at 9am local time, so I headed to a WeWork and had a wonderful conversation with some local technology people here already despite feeling a little crazy after the long flight. Not a bad view from the coworking space either.

<br />

Looking forward to the conference. I'll post some daily rollups here!
"""

