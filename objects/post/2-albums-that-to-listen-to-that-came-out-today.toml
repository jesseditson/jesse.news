# 2 albums that to listen to that came out today

![1.00](https://uploads.archival.dev/343d39d42160d9a423b688fb4bdaa33d0356b513d5adc776ce67e84322e5a1d7/fb713fdad8166de047bf7ed6070b57f716df58f8bc9e22747bdc2030e7134e29/image.png)

### No Bad Memories - The Avalanches

I've been revisiting Since I Left You a lot lately, it was such an important album in general and left a big impression on me. It has such a special power of both being very complete as a single art piece and having a bunch of great singles. This one doesn't quite get there on the first listen, but is unmistakably avalanches, and despite the cover, isn't just a great listen because of nostalgia - it's contemporary and fun.

<br />

![1.00](https://uploads.archival.dev/343d39d42160d9a423b688fb4bdaa33d0356b513d5adc776ce67e84322e5a1d7/d9f409eeeed01c4506db53d898be30ce5307fa3b8121726bd85f79d68bf5cca0/image.png)

### do you love the color of the sky? - Dummy

This LA group has been putting out some really great stuff since 2021 - I have both their earlier albums on vinyl so I pre-ordered this one, and was delighted to hear that it maintains their driving poppy psych-shoegaze style, but has some really fun D\&B stuff going on. Gonna be spinning this one a lot!

'''

